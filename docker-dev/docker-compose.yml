services:
  wordpress:
    image: wordpress:php8.4
    ports:
      - 8000:80
    environment:
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DEBUG: 1
    volumes:
      - ..:/var/www/html/wp-content/plugins/geo-mashup
      - ../../geo-mashup-custom:/var/www/html/wp-content/plugins/geo-mashup-custom
      - uploads:/var/www/html/wp-content/uploads
  mysql:
    image: mariadb:11
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      MARIADB_DATABASE: wordpress
    volumes:
      - mysql:/var/lib/mysql
  install:
    image: geo-mashup-dev-install
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PHP_VERSION: 8.3
    # Run as the host user so files written to the checkout aren't owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ..:/app
    working_dir: /app
    command: pnpm run install:dev

volumes:
  uploads:
  mysql:
