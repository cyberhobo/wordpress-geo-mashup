name: E2E Testing

on:
  push:
    branches: [ "develop", "feature/*", "release/*" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: Google Maps tests are skipped when this is empty.
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        coverage: none
        tools: composer

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-dev

    # Installs the pnpm from package.json "packageManager", the Node.js from
    # "devEngines.runtime", and runs a frozen-lockfile install.
    - name: Setup pnpm, Node.js, and dependencies
      uses: pnpm/setup@v3
      with:
        cache: true
        require-lockfile: true

    - name: Install Playwright browser
      run: pnpm exec playwright install --with-deps chromium

    - name: Start WordPress
      run: pnpm run e2e:env:start

    - name: Run E2E tests
      run: pnpm run e2e

    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
